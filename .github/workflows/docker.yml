name: Docker image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: chain-api-signer-oss
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME || 'ychain' }}
  PACKAGES_REPOSITORY: ${{ vars.SIGNER_PACKAGES_REPOSITORY || 'ychainhq/packages' }}

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout signer
        uses: actions/checkout@v4
        with:
          path: build-context/signer-oss

      - name: Checkout external signer packages
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PACKAGES_REPOSITORY }}
          path: build-context/packages

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: build-context/signer-oss/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: build-context/signer-oss

      - name: Test
        run: npm test
        working-directory: build-context/signer-oss

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./build-context
          file: ./build-context/signer-oss/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
